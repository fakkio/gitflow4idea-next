name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search the [existing issues](https://github.com/fakkio/gitflow4idea-next/issues?q=is%3Aissue) first, in case it was already proposed.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and how you work today without it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What you would like the plugin to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including doing it by hand with `git flow`.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or the git-flow implementation you use (`git flow version`).
