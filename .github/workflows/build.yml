name: Build

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiles against the default platform (IntelliJ IDEA 2026.3); verifies on the oldest supported IDE.
      - name: Build and verify
        run: ./gradlew buildPlugin verifyPlugin -PverifyIdes=IC-2024.2.6
