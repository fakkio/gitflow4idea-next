name: Build

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The default platform (IntelliJ IDEA 2026.3) no longer bundles com.intellij.tasks,
      # so compile and verify against a version that does.
      - name: Build and verify
        run: ./gradlew buildPlugin verifyPlugin -PplatformVersion=2025.2.4 -PverifyIdes=IC-2024.2.6
