name: Publish to the JetBrains Marketplace

# Publishing the draft GitHub Release (gh release edit v<version> --draft=false) uploads
# that tag to the JetBrains Marketplace. Needs the PUBLISH_TOKEN repository secret.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that the tag matches the plugin version
        run: |
          tag_version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          gradle_version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "Tag $GITHUB_EVENT_RELEASE_TAG_NAME does not match version $gradle_version in build.gradle.kts" >&2
            exit 1
          fi
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Publish the plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
